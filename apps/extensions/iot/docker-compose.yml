version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2.0
    profiles: ["tag-iot"]
    container_name: netlocal_mosquitto
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - localnet_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mosquitto.rule=Host(`mqtt.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.mosquitto.loadbalancer.server.port=1883"
      - "netlocal.tag=iot"
  chirpstack:
    image: chirpstack/chirpstack:4
    profiles: ["tag-iot"]
    container_name: netlocal_chirpstack
    environment:
      - POSTGRESQL__HOST=postgres
      - POSTGRESQL__USER=chirpstack
      - POSTGRESQL__PASSWORD=${CHIRPSTACK_DB_PASSWORD}
    depends_on:
      - postgres
    networks:
      - localnet_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chirpstack.rule=Host(`lora.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"

volumes:
  mosquitto_data: