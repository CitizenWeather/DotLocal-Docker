version: "3.8"

services:
  # ---------- Search backend ----------
  opensearch:
    image: opensearchproject/opensearch:2.11.1
    container_name: fess-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true                # required by Fess
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"         # adjust memory as needed
    ports:
      - "9200:9200"                                   # OpenSearch API (internal only, can be removed)
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - search-net
    restart: unless-stopped

  # ---------- Search server (crawler + UI) ----------
  fess:
    image: ghcr.io/codelibs/fess:14.15.0
    container_name: fess
    environment:
      - "FESS_ES_HTTP_URL=http://opensearch:9200"     # points to the OpenSearch container
      - "FESS_DICTIONARY_PATH=/opt/fess/data/dict"
    ports:
      - "8080:8080"                                   # Fess web interface
    volumes:
      - fess-data:/opt/fess/data                      # persistent configuration & logs
    networks:
      - search-net
    depends_on:
      - opensearch
    restart: unless-stopped

volumes:
  opensearch-data:
  fess-data:

networks:
  search-net:
    driver: bridge