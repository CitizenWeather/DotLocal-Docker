<!DOCTYPE html>
<html>
<head>
    <title>CDN Manager</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        input, button { padding: 0.5rem; margin: 0.25rem; }
        #stats { margin-top: 1rem; background: #f4f4f4; padding: 1rem; }
    </style>
</head>
<body>
    <h1>Local CDN Manager</h1>
    <div>
        <h3>Purge Cache</h3>
        <input type="text" id="purge-url" placeholder="URL to purge (e.g., /images/logo.png)">
        <button onclick="purge()">Purge</button>
    </div>
    <div>
        <h3>Statistics</h3>
        <button onclick="loadStats()">Refresh Stats</button>
        <div id="stats">Click refresh</div>
    </div>
    <script src="script.js"></script>
</body>
</html>
