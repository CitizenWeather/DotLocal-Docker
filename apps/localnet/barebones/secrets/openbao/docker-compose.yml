version: '3.8'

services:
  openbao:
    image: openbao/openbao:latest
    container_name: netlocal_openbao
    cap_add:
      - IPC_LOCK
    command: server -dev -dev-listen-address=0.0.0.0:8200 -dev-root-token-id=${OPENBAO_ROOT_TOKEN:-root}
    volumes:
      - openbao_data:/vault/data
      - ./config/bao.hcl:/vault/config/bao.hcl:ro
    environment:
      - BAO_ADDR=http://0.0.0.0:8200
    networks:
      - localnet_default
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "bao", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openbao.rule=Host(`secrets.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.openbao.loadbalancer.server.port=8200"
      - "netlocal.component=secrets"

volumes:
  openbao_data: