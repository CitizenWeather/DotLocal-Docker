version: '3.8'

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: netlocal_uptime_kuma
    volumes:
      - uptimekuma_data:/app/data
    networks:
      - localnet_default
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`status.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"
      - "netlocal.component=status"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  uptimekuma_data:
