version: '3.8'

services:
  health:
    image: alpine:3.19
    container_name: netlocal_health
    command: >
      /bin/sh -c "
        apk add --no-cache curl &&
        mkdir -p /www &&
        while true; do
          echo 'OK' > /www/health;
          echo '{\"status\":\"ok\"}' > /www/health.json;
          sleep 10;
        done
      "
    networks:
      - localnet_default
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.health.rule=Host(`health.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.health.loadbalancer.server.port=80"
      - "netlocal.component=health"
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
