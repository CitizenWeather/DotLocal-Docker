version: '3.8'

services:
  nats:
    image: nats:2.10-alpine
    container_name: netlocal_nats
    command: -js -m 8222
    volumes:
      - messaging_data:/data
    networks:
      - localnet_default
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "netlocal.component=messages"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  messaging_data:
