version: '3.8'

services:
  caddy:
    image: caddy:latest
    container_name: netlocal_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./config/Caddyfile:/etc/caddy/Caddyfile:ro
      - gateway_data:/data
    networks:
      - localnet_default
    labels:
      - "netlocal.component=gateway"

volumes:
  gateway_data: