version: '3.8'

services:
  redis:
    image: redis/redis-stack:latest
    container_name: netlocal_redis
    environment:
      - REDIS_ARGS=--appendonly yes
    volumes:
      - cache_data:/data
    networks:
      - localnet_default
    labels:
      - "netlocal.component=cache"

volumes:
  cache_data: