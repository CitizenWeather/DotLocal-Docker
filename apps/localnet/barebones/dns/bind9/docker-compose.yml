version: '3.8'

services:
  dns:
    image: ubuntu/bind9:latest
    container_name: netlocal_dns
    volumes:
      - ./config/named.conf:/etc/bind/named.conf:ro
      - ./config/zones:/etc/bind/zones:ro
    networks:
      localnet_backbone:
        ipv4_address: 169.254.0.2
    restart: unless-stopped
    labels:
      - "netlocal.component=dns"
      - "netlocal.layer=backbone"