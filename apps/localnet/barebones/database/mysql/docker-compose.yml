version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: netlocal_mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
      - MYSQL_DATABASE=netlocal
      - MYSQL_USER=netlocal
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - localnet_default
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
    labels:
      - "netlocal.component=database"

volumes:
  db_data: