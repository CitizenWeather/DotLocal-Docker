version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: netlocal_postgres
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=netlocal
      - POSTGRES_DB=netlocal
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - localnet_default
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "netlocal.component=database"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netlocal"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
