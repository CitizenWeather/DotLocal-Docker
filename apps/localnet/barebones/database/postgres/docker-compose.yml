version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: netlocal_postgres
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=netlocal
      - POSTGRES_DB=netlocal
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - localnet_default
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "netlocal"]

volumes:
  db_data: