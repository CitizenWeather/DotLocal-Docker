version: '3.8'

services:
  ca:
    image: smallstep/step-ca:0.27.0
    container_name: netlocal_ca
    volumes:
      - ca_data:/home/step
    environment:
      - STEPPATH=/home/step
      - DOCKER_STEPCA_INIT_NAME=NetLocal Root CA
      - DOCKER_STEPCA_INIT_DNS_NAMES=ca.${NETLOCAL_ROOT_DOMAIN:-net.local},localhost
      - DOCKER_STEPCA_INIT_PROVISIONER_NAME=acme
    networks:
      localnet_backbone:
        ipv4_address: 169.254.0.4
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "netlocal.component=ca"
      - "netlocal.layer=backbone"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "--no-check-certificate", "https://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  ca_data:
