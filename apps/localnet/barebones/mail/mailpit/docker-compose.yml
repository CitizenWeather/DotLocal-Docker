version: '3.8'

services:
  mailpit:
    image: axllent/mailpit:v1.19
    container_name: netlocal_mailpit
    profiles: ["tier1"]
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_MAX_MESSAGES=5000
    volumes:
      - mailpit_data:/data
    networks:
      - localnet_default
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`devmail.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"
      - "netlocal.component=mail"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  mailpit_data:
