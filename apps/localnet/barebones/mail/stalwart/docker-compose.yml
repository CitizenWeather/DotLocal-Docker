version: '3.8'

services:
  stalwart:
    image: stalwartlabs/mail-server:latest
    container_name: netlocal_stalwart
    environment:
      - STALWART_SECRET=${STALWART_SECRET}
      - STALWART_DOMAIN=${NETLOCAL_ROOT_DOMAIN:-net.local}
    volumes:
      - ./config/stalwart.toml:/etc/stalwart.toml:ro
      - mta_data:/opt/stalwart-mail
    networks:
      - localnet_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stalwart-smtp.rule=Host(`smtp.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.stalwart-smtp.loadbalancer.server.port=25"
      - "traefik.http.routers.stalwart-imap.rule=Host(`imap.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.stalwart-imap.loadbalancer.server.port=143"

volumes:
  mta_data: