version: '3.8'

services:
  minio:
    image: minio/minio:RELEASE.2024-03-15T01-07-19Z
    container_name: netlocal_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
    volumes:
      - storage_data:/data
    networks:
      - localnet_default
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`minio.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.minio.loadbalancer.server.port=9000"
      - "traefik.http.routers.minio-console.rule=Host(`minio-console.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.minio-console.loadbalancer.server.port=9001"
      - "netlocal.component=storage"
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  storage_data:
