title = "DotLocal-Docker gitleaks config"

[allowlist]
description = "Allowlist for known placeholder and example values"

# Placeholder credential values used intentionally in .env.example and compose defaults.
regexes = [
  '''changeme''',
  '''change_me''',
  '''your[_-]?password''',
  '''your[_-]?secret''',
  '''your[_-]?api[_-]?key''',
]

# gitleaks path patterns are regexes, not globs.
paths = [
  '''\.env\.example''',
  '''docs/''',
  '''SETUP\.md''',
]
