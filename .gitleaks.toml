title = "DotLocal-Docker gitleaks config"

[allowlist]
description = "Allowlist for known placeholder and example values"

# Ignore placeholder credential values used in .env.example and docker-compose defaults.
# These are intentionally not real secrets.
regexes = [
  "changeme",
  "change_me",
  "your[_-]?password",
  "your[_-]?secret",
  "your[_-]?api[_-]?key",
]

paths = [
  ".env.example",
  ".env.example.*",
  "docs/",
  "SETUP.md",
]
