services:
  caddy:
    image: caddy:2-alpine
    container_name: netlocal_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - localnet_default
    labels:
      - "netlocal.component=gateway"

volumes:
  caddy_data:
  caddy_config:

networks:
  localnet_default:
    external: true
