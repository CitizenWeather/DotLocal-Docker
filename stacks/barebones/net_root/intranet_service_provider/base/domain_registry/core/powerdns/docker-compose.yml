services:
  powerdns:
    image: powerdns/pdns-auth-49:latest
    container_name: netlocal_powerdns
    depends_on:
      - postgres
    environment:
      - PDNS_gpgsql_host=postgres
      - PDNS_gpgsql_port=5432
      - PDNS_gpgsql_user=powerdns
      - PDNS_gpgsql_password=${POSTGRES_PASSWORD}
      - PDNS_gpgsql_dbname=powerdns
      - PDNS_api=yes
      - PDNS_api_key=${POWERDNS_API_KEY}
      - PDNS_webserver=yes
      - PDNS_webserver_address=0.0.0.0
      - PDNS_webserver_password=${POWERDNS_API_KEY}
    networks:
      localnet_backbone:
        ipv4_address: 169.254.0.3
      localnet_default:
    volumes:
      - registry_data:/var/lib/powerdns
    labels:
      - "netlocal.component=registry"
      - "traefik.enable=true"
      - "traefik.http.routers.powerdns.rule=Host(`registrar.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"

volumes:
  registry_data:

networks:
  localnet_backbone:
    external: true
  localnet_default:
    external: true
