version: '3.8'

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: netlocal_uptime_kuma
    volumes:
      - uptimekuma_data:/app/data
    networks:
      - localnet_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uptime.rule=Host(`status.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.uptime.loadbalancer.server.port=3001"

volumes:
  uptimekuma_data: