services:
  postgres:
    image: postgres:16-alpine
    container_name: netlocal_postgres
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_USER=netlocal
      - POSTGRES_DB=netlocal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - localnet_default
    labels:
      - "netlocal.component=database"
    stop_grace_period: 30s

volumes:
  postgres_data:

networks:
  localnet_default:
    external: true
