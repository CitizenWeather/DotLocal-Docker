services:
  whoisd:
    image: likexian/whois-server:latest
    container_name: netlocal_whoisd
    environment:
      - WHOIS_DOMAIN=${NETLOCAL_ROOT_DOMAIN:-net.local}
    networks:
      - localnet_default
    labels:
      - "netlocal.component=whois"

networks:
  localnet_default:
    external: true
