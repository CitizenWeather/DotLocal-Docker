version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    profiles: ["tag-dev"]
    container_name: netlocal_n8n
    environment:
      - N8N_HOST=n8n.${NETLOCAL_ROOT_DOMAIN:-net.local}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - localnet_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"

  plantuml:
    image: plantuml/plantuml-server:jetty
    profiles: ["tag-dev"]
    container_name: netlocal_plantuml
    networks:
      - localnet_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.plantuml.rule=Host(`plantuml.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"

volumes:
  n8n_data: