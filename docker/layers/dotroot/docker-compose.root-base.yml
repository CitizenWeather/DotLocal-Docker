# docker-compose.base.yml
# Base networks and volumes – always included.
version: '3.8'

networks:
  localnet_backbone:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETLOCAL_SUBNET_BACKBONE:-169.254.0.0/16}
    internal: true

  localnet_default:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETLOCAL_SUBNET_DEFAULT:-172.20.0.0/16}

volumes:
  # Core volumes – named for persistence across swaps
  dns_data:
  ca_data:
  registry_data:
  policy_data:
  gateway_data:
  db_data:
  cache_data:
  storage_data:
  messaging_data:
  mta_data:
  webmail_data:
  heimdall_data:
  whoisd_data:
  uptimekuma_data:
  squid_data: