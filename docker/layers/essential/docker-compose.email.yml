# docker-compose.email.yml
# Email tiers (1-4). Profiles: tier1, tier2, tier3, tier4.
services:
  # Common for tiers 2,3,4: Central MTA (Stalwart)
  stalwart:
    image: stalwartlabs/mail-server:latest
    profiles: ["tier2", "tier3", "tier4"]
    container_name: netlocal_stalwart
    environment:
      - STALWART_SECRET=${STALWART_SECRET}
      - STALWART_DOMAIN=${NETLOCAL_ROOT_DOMAIN:-net.local}
    volumes:
      - ./config/email/stalwart/stalwart.toml:/etc/stalwart.toml:ro
      - mta_data:/opt/stalwart-mail
    networks:
      - localnet_default
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stalwart-smtp.rule=Host(`smtp.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.stalwart-smtp.loadbalancer.server.port=25"
      - "traefik.http.routers.stalwart-imap.rule=Host(`imap.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.stalwart-imap.loadbalancer.server.port=143"

  # Webmail client (for all tiers >=2)
  webmail:
    image: lscr.io/linuxserver/snappymail:latest
    profiles: ["tier2", "tier3", "tier4"]
    container_name: netlocal_webmail
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - webmail_data:/data
    networks:
      - localnet_default
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.webmail.rule=Host(`mail.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.webmail.loadbalancer.server.port=80"

  # Tier 1 only: Mailpit (dev sink)
  mailpit:
    image: axllent/mailpit:latest
    profiles: ["tier1"]
    container_name: netlocal_mailpit
    environment:
      - MP_SMTP_AUTH_ACCEPT_ANY=1
    networks:
      - localnet_default
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mailpit.rule=Host(`devmail.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.mailpit.loadbalancer.server.port=8025"

  # Tier 3 extras (Dovecot for larger mailboxes – optional)
  dovecot:
    image: dovecot/dovecot:latest
    profiles: ["tier3"]
    container_name: netlocal_dovecot
    volumes:
      - mta_data:/var/mail
    networks:
      - localnet_default
    depends_on:
      - stalwart
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dovecot.rule=Host(`imap-heavy.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.dovecot.loadbalancer.server.port=143"

  # Tier 4 extras (external relay)
  external-relay:
    image: ghcr.io/mailu/postfix:latest
    profiles: ["tier4"]
    container_name: netlocal_external_relay
    environment:
      - RELAYHOST=[smtp.gmail.com]:587
      - RELAYHOST_USERNAME=${EXTERNAL_SMTP_USER}
      - RELAYHOST_PASSWORD=${EXTERNAL_SMTP_PASS}
    networks:
      - localnet_default
    restart: unless-stopped
    depends_on:
      - stalwart