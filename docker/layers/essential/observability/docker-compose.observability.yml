# docker-compose.observability.yml
# Full observability stack: metrics, logs, traces.
version: '3.8'

services:
  # Prometheus – metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: netlocal_prometheus
    volumes:
      - ./config/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - localnet_default
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`metrics.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
      - "netlocal.layer=observability"
      - "netlocal.tag=observability"

  # Grafana – dashboards
  grafana:
    image: grafana/grafana:latest
    container_name: netlocal_grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - localnet_default
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.grafana.loadbalancer.server.port=3000"
      - "netlocal.layer=observability"
      - "netlocal.tag=observability"

  # Loki – log aggregation
  loki:
    image: grafana/loki:latest
    container_name: netlocal_loki
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
      - ./config/observability/loki/loki-config.yaml:/etc/loki/local-config.yaml:ro
    networks:
      - localnet_default
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.loki.rule=Host(`logs.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.loki.loadbalancer.server.port=3100"
      - "netlocal.layer=observability"
      - "netlocal.tag=observability"

  # Promtail – log collector (sends to Loki)
  promtail:
    image: grafana/promtail:latest
    container_name: netlocal_promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./config/observability/promtail/promtail-config.yaml:/etc/promtail/config.yml:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - localnet_default
    restart: unless-stopped
    labels:
      - "netlocal.layer=observability"
      - "netlocal.tag=observability"

  # Tempo – distributed tracing
  tempo:
    image: grafana/tempo:latest
    container_name: netlocal_tempo
    command: -config.file=/etc/tempo/tempo-config.yaml
    volumes:
      - tempo_data:/var/tempo
      - ./config/observability/tempo/tempo-config.yaml:/etc/tempo/tempo-config.yaml:ro
    networks:
      - localnet_default
    ports:
      - "14268:14268"   # jaeger ingest
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.tempo.rule=Host(`trace.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.tempo.loadbalancer.server.port=3200"
      - "netlocal.layer=observability"
      - "netlocal.tag=observability"

volumes:
  prometheus_data:
  grafana_data:
  loki_data:
  tempo_data: