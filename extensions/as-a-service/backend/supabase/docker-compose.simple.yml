# Supabase self-hosted — single-node deployment
# Based on the official Supabase Docker quickstart.
# For production clustering, see docker-compose.full.yml

services:
  supabase-db:
    image: supabase/postgres:15.1.0.117
    container_name: netlocal_supabase_db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - supabase_db:/var/lib/postgresql/data
    networks:
      - localnet_default

  supabase-studio:
    image: supabase/studio:latest
    container_name: netlocal_supabase_studio
    environment:
      SUPABASE_URL: http://supabase-kong:8000
      STUDIO_PG_META_URL: http://supabase-meta:8080
    networks:
      - localnet_default
    labels:
      - "netlocal.component=backend-as-a-service"
      - "traefik.enable=true"
      - "traefik.http.routers.supabase.rule=Host(`supabase.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.supabase.loadbalancer.server.port=3000"

volumes:
  supabase_db:

networks:
  localnet_default:
    external: true
