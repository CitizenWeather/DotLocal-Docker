version: '3.8'

services:
  nats:
    image: nats:2.10-alpine
    container_name: netlocal_nats
    command: -js -sd /data
    volumes:
      - messaging_data:/data
    networks:
      - localnet_default
    labels:
      - "netlocal.component=messaging"
    stop_grace_period: 30s

volumes:
  messaging_data:
