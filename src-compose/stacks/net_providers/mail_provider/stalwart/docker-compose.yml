services:
  stalwart:
    image: stalwartlabs/mail-server:latest
    container_name: netlocal_stalwart
    volumes:
      - stalwart_data:/opt/stalwart-mail
    networks:
      - localnet_default
    labels:
      - "netlocal.component=mail"
      - "traefik.enable=true"
      - "traefik.http.routers.stalwart.rule=Host(`webmail.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
      - "traefik.http.services.stalwart.loadbalancer.server.port=8080"

  snappymail:
    image: djmaze/snappymail:latest
    container_name: netlocal_snappymail
    networks:
      - localnet_default
    labels:
      - "netlocal.component=webmail"
      - "traefik.enable=true"
      - "traefik.http.routers.snappymail.rule=Host(`snappymail.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"
    stop_grace_period: 30s

volumes:
  stalwart_data:

networks:
  localnet_default:
    external: true
