global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # add alertmanager container here if deployed

scrape_configs:
  - job_name: netlocal-gateway
    static_configs:
      - targets:
          - netlocal_traefik:8080

  - job_name: netlocal-dns
    static_configs:
      - targets:
          - netlocal_dns:9153

  - job_name: netlocal-postgres
    static_configs:
      - targets:
          - netlocal_postgres:9187  # requires postgres-exporter sidecar

  - job_name: netlocal-redis
    static_configs:
      - targets:
          - netlocal_redis:9121  # requires redis-exporter sidecar

  - job_name: netlocal-minio
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets:
          - netlocal_minio:9000
