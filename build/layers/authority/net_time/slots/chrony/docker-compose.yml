services:
  chrony:
    image: cturra/ntp:latest
    container_name: netlocal_chrony
    environment:
      - NTP_SERVERS=time.cloudflare.com,pool.ntp.org
    networks:
      localnet_backbone:
        ipv4_address: 169.254.0.5
      localnet_default:
    labels:
      - "netlocal.component=ntp"

networks:
  localnet_backbone:
    external: true
  localnet_default:
    external: true
