services:
  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:latest
    container_name: netlocal_redpanda
    command:
      - redpanda start
      - --smp 1
      - --memory 1G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:19092
    volumes:
      - messaging_data:/var/lib/redpanda/data
    networks:
      - localnet_default
    labels:
      - "netlocal.component=messaging"

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:latest
    container_name: netlocal_redpanda_console
    environment:
      - CONFIG_FILEPATH=/etc/redpanda/redpanda-console-config.yaml
    networks:
      - localnet_default
    depends_on:
      - redpanda
    labels:
      - "netlocal.component=messaging"
      - "traefik.enable=true"
      - "traefik.http.routers.redpanda.rule=Host(`redpanda.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"

volumes:
  messaging_data:

networks:
  localnet_default:
    external: true
