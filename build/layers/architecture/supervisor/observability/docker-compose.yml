services:
  grafana:
    image: grafana/grafana:latest
    container_name: netlocal_grafana
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - localnet_default
    labels:
      - "netlocal.component=observability"
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"

  loki:
    image: grafana/loki:latest
    container_name: netlocal_loki
    command: -config.file=/etc/loki/loki-config.yaml
    volumes:
      - ./slots/loki/config/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki_data:/loki
    networks:
      - localnet_default
    labels:
      - "netlocal.component=observability"

  promtail:
    image: grafana/promtail:latest
    container_name: netlocal_promtail
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./slots/promtail/config/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - localnet_default
    labels:
      - "netlocal.component=observability"

  tempo:
    image: grafana/tempo:latest
    container_name: netlocal_tempo
    command: -config.file=/etc/tempo/tempo-config.yml
    volumes:
      - ./slots/tempo/config/tempo-config.yml:/etc/tempo/tempo-config.yml:ro
      - tempo_data:/var/tempo
    networks:
      - localnet_default
    labels:
      - "netlocal.component=observability"
    stop_grace_period: 30s

volumes:
  grafana_data:
  loki_data:
  tempo_data:

networks:
  localnet_default:
    external: true
