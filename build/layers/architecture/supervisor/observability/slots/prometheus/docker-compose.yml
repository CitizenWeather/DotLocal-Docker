services:
  prometheus:
    image: prom/prometheus:latest
    container_name: netlocal_prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - localnet_default
    labels:
      - "netlocal.component=observability"
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`metrics.${NETLOCAL_ROOT_DOMAIN:-net.local}`)"

volumes:
  prometheus_data:

networks:
  localnet_default:
    external: true
