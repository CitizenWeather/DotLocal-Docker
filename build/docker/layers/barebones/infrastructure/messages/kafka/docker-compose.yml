version: '3.8'

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: netlocal_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - localnet_default

  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: netlocal_kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - localnet_default
    labels:
      - "netlocal.component=messaging"