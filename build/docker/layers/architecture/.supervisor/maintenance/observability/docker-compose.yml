version: '3.8'

# Core observability services included when ENABLE_OBSERVABILITY=true.
# Grafana: dashboards and visualisation.
# Promtail: log collector (ships container logs to the log backend).
# Backend slots (LOG_APP, TRACE_APP) are assembled separately via Makefile.

services:
  grafana:
    image: grafana/grafana:latest
    container_name: netlocal_grafana
    environment:
      GF_SERVER_ROOT_URL: "https://grafana.${NETLOCAL_ROOT_DOMAIN:-net.local}"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Viewer"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - localnet_default
    labels:
      - "netlocal.component=observability"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: netlocal_promtail
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./slots/promtail/config/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - localnet_default
    labels:
      - "netlocal.component=observability"
    restart: unless-stopped

volumes:
  grafana_data:
