version: '3.8'

services:
  iptables-policy:
    image: alpine:latest
    container_name: netlocal_iptables_policy
    # Applies rules once at startup then exits. Restart on failure only.
    command: sh /etc/policy/rules.sh
    cap_add:
      - NET_ADMIN
    network_mode: host
    volumes:
      - ./config/rules.sh:/etc/policy/rules.sh:ro
    labels:
      - "netlocal.component=policy"
    restart: on-failure
