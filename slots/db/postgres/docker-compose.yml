version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: netlocal_postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: netlocal
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - localnet_default
    labels:
      - "netlocal.component=db"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  db_data:
