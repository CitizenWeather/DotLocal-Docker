version: '3.8'

services:
  tempo:
    image: grafana/tempo:latest
    container_name: netlocal_tempo
    command: -config.file=/etc/tempo/config.yml
    volumes:
      - ./config/tempo-config.yml:/etc/tempo/config.yml:ro
      - trace_data:/var/tempo
    ports:
      - "3200:3200"
    networks:
      - localnet_default
    labels:
      - "netlocal.component=trace"
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  trace_data:
