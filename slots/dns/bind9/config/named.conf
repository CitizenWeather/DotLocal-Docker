// BIND9 configuration for NetLocal.
// Edit NETLOCAL_ROOT_DOMAIN to match your .env value (default: net.local)

options {
    directory "/var/cache/bind";
    forwarders { 169.254.0.3; };
    forward only;
    dnssec-validation no;
    listen-on { any; };
    allow-query { any; };
};

zone "net.local" {
    type master;
    file "/etc/bind/zones/db.net.local";
};
