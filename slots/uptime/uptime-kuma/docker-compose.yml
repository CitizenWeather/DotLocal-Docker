version: '3.8'

services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: netlocal_uptime_kuma
    volumes:
      - uptime_data:/app/data
    networks:
      - localnet_default
    labels:
      - "netlocal.component=uptime"
    restart: unless-stopped
    stop_grace_period: 30s

volumes:
  uptime_data:
