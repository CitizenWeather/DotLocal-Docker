# Empty template, filename should be addon_profile.toml

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"  # or "setuptools.build_meta"

[extension]
name = "CHANGE_ME"
version = "0.0.1"
description = "A short description of the addon"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" }
]
classifiers = [# TODO: update project classifiers
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
requires-python = ">=3.13"
dependencies = [
    # e.g., "requests>=2.28"
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov",
    "black>=23",
    "flake8",
    "mypy",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]          # src-layout
include = ["mypackage*"] # package name(s)  TODO: what needs to go here?

[tool.black]
line-length = 88

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
